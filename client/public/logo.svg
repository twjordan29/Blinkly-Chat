<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background glow -->
  <circle cx="50" cy="50" r="38" fill="url(#logoGrad)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.3" />
  
  <!-- Logo Body -->
  <path d="M 30,50 
           C 30,38 38,30 50,30 
           C 62,30 70,38 70,50 
           C 70,62 62,70 50,70 
           C 44,70 41,68 37,71 
           C 35.5,72.2 33,73.5 32,74 
           C 31.8,74.1 31.5,73.8 31.6,73.2 
           C 32,71 32.5,67 31,65 
           C 30.3,64 30,57 30,50 Z" 
        fill="url(#logoGrad)" />
        
  <!-- Spark/Lightning line to indicate "Blinkly" / fast -->
  <path d="M 46,40 L 58,48 L 48,52 L 54,60" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
